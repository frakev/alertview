# Example only. As soon as the bearer_token lines below hold real values, this
# must become a Secret: a ConfigMap is readable by anything that can list
# ConfigMaps in the namespace, and it usually ends up in git.
#
#   kubectl create secret generic alertview-config \
#     --from-file=config.yaml=./config.yaml -n alertview
#
# then point the volume at it — see docs/deployment/kubernetes.md#secrets-management
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertview-config
  namespace: alertview
data:
  config.yaml: |
    port: 8080
    refresh_interval: 30
    tls_insecure: false

    sources:
      - name: "Alertmanager"
        type: alertmanager
        url: "http://alertmanager.example.com:9093"
        dashboard_url: "https://grafana.example.com/alerting/list"

      - name: "Grafana"
        type: grafana
        url: "https://grafana.example.com/"
        bearer_token: "YOUR_GRAFANA_TOKEN_HERE"
        dashboard_url: "https://grafana.example.com/"

      - name: "Zabbix"
        type: zabbix
        url: "https://zabbix.example.com/zabbix"
        bearer_token: "YOUR_ZABBIX_TOKEN_HERE"
        dashboard_url: "https://zabbix.example.com/zabbix/zabbix.php?action=problem.view"

    display:
      labels:
        - namespace
        - job
        - instance
        - cluster
        - node
        - pod
        - host
        - hostgroup
