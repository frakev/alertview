apiVersion: v1
kind: ConfigMap
metadata:
  name: alertview-config
  namespace: alertview
data:
  config.yaml: |
    port: 8080
    refresh_interval: 30
    tls_insecure: false

    sources:
      - name: "Alertmanager"
        type: alertmanager
        url: "http://alertmanager.monitoring.svc.cluster.local:9093"
        dashboard_url: "https://grafana.example.com/alerting/list"   # Replace with your Grafana URL

      # - name: "Grafana"
      #   type: grafana
      #   url: "http://grafana.monitoring.svc.cluster.local:3000"
      #   dashboard_url: "https://grafana.example.com/alerting/list"   # Replace with your Grafana URL
      #   bearer_token: "glsa_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx_xxxxxxxx"

    display:
      labels:
        - namespace
        - job
        - instance
        - cluster
        - node
        - pod
