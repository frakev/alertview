name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      # actions-rs/* has been archived since 2022 and runs on a Node version
      # GitHub no longer supports.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Rename binary with architecture
        run: cp target/x86_64-unknown-linux-gnu/release/alertview target/x86_64-unknown-linux-gnu/release/alertview-linux-amd64

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: AlertView v${{ steps.version.outputs.VERSION }}
          tag_name: v${{ steps.version.outputs.VERSION }}
          body: |
            ## What's Changed
            
            ### Features
            - See [CHANGELOG.md](https://github.com/frakev/alertview/blob/main/CHANGELOG.md)
            
            ### Fixes
            - See [CHANGELOG.md](https://github.com/frakev/alertview/blob/main/CHANGELOG.md)
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            target/x86_64-unknown-linux-gnu/release/alertview-linux-amd64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN || secrets.GHCR_TOKEN }}