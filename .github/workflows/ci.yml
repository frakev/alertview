name: CI

on:
  push:
    branches: [main]
  pull_request:

# Pull requests from forks get a read-only token and no secrets; say so
# explicitly rather than relying on the repository default.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: clippy + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

  frontend:
    name: static assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No bundler here, so a syntax error in app.js would only show up in a
      # browser — and the served page would be blank.
      - name: Syntax check
        run: |
          node --check static/app.js
          node --check static/sw.js
