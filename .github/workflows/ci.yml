name: CI

on:
  push:
    branches: [main]
  pull_request:

# Pull requests from forks get a read-only token and no secrets; say so
# explicitly rather than relying on the repository default.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: clippy + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

  audit:
    name: dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Two advisories reached a release because nothing was watching the lock
      # file; they were found by hand. This is that check, automated.
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    name: static assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No bundler here, so a syntax error in app.js would only show up in a
      # browser — and the served page would be blank.
      - name: Syntax check
        run: |
          node --check static/app.js
          node --check static/sw.js
          node --check static/theme.js

      # Runs the real render functions from app.js. The escaping bug fixed in
      # 0.10.0 was invisible to a syntax check.
      - name: Render tests
        run: node tests/frontend/render.test.js
