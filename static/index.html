<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlertView</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="bg-layer" aria-hidden="true">
  <div class="bg-grid"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<header class="header">
  <div class="header-top">
    <div class="logo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
        <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
      AlertView
    </div>

    <div class="stats-bar" id="stats-bar"></div>

    <div class="search-wrap">
      <svg class="search-ico" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input type="search" id="search" class="search-input" placeholder="Search alerts, labels, annotations..." autocomplete="off" spellcheck="false">
      <button class="search-clear" id="search-clear" title="Clear">✕</button>
    </div>

    <div class="hdr-right">
      <div class="refresh-info">
        <div class="spinner" id="spinner"></div>
        <span id="last-refresh">–</span>
        <span>·</span>
        <span>↻&thinsp;<b id="countdown">–</b>s</span>
      </div>
      <button class="icon-btn" id="refresh-btn" title="Refresh now">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
          <polyline points="1 4 1 10 7 10"/><polyline points="23 20 23 14 17 14"/>
          <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"/>
        </svg>
      </button>
      <button class="icon-btn" id="notif-btn" title="Browser notifications">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
      </button>
      <!-- TV Mode -->
      <button class="icon-btn" id="tv-btn" title="TV Mode (T)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
        </svg>
      </button>
      <button class="icon-btn" id="theme-btn" title="Light/Dark theme">
        <svg id="theme-ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>
  </div>
  <div class="sources-bar" id="sources-bar"></div>
</header>

<!-- TV overlay (visible only in TV mode) -->
<div class="tv-overlay" id="tv-overlay">
  <!-- Filter panel (severity / source / silence) -->
  <div class="tv-panel" id="tv-panel">
    <div class="tv-row">
      <span class="tv-label">Severity</span>
      <div class="tv-chips" id="tv-sev-chips"></div>
    </div>
    <div class="tv-row">
      <span class="tv-label">Source</span>
      <div class="tv-chips" id="tv-src-chips"></div>
    </div>
    <div class="tv-row">
      <span class="tv-label">Silenced</span>
      <button class="silence-toggle" id="tv-silence-btn"></button>
    </div>
  </div>
  <!-- Floating HUD bar -->
  <div class="tv-bar" id="tv-bar">
    <span class="tv-clock" id="tv-clock">00:00</span>
    <div class="tv-dots" id="tv-dots"></div>
    <span class="tv-cd">↻&thinsp;<span id="tv-cd">–</span>s</span>
    <span class="tv-bar-sep"></span>
    <button class="tv-hud-btn" id="tv-theme-btn" title="Toggle theme">
      <svg id="tv-theme-ico" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
    <button class="tv-hud-btn" id="tv-settings-btn" title="Filters">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/>
      </svg>
    </button>
    <button class="tv-hud-btn tv-hud-exit" id="tv-exit-btn" title="Exit TV Mode">✕</button>
  </div>
</div>

<main class="main">
  <div class="toolbar">
    <span class="alert-count" id="alert-count"></span>
    <div style="display:flex;gap:.5rem;align-items:center">
      <button class="silence-toggle" id="silence-btn"></button>
      <div class="src-filter-chips" id="src-filter-chips"></div>
    </div>
  </div>
  <div class="alert-list" id="alert-list">
    <div class="empty-state">
      <div class="empty-state-icon">⏳</div>
      <div>Loading...</div>
    </div>
  </div>
</main>

<script src="/app.js"></script>
</body>
</html>
