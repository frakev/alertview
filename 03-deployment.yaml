apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertview
  namespace: alertview
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertview
  template:
    metadata:
      labels:
        app: alertview
    spec:
      # The image ships as 65532 and writes nothing: its configuration is a
      # read-only mount and it keeps no state.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alertview
          # Pin the version rather than track :latest. With :latest and
          # IfNotPresent a restart silently keeps whatever the node already had,
          # so a rollout never actually rolled anything out.
          image: ghcr.io/frakev/alertview:0.13.3
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command: ["alertview"]
          args: ["/config/config.yaml"]
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 3
      volumes:
        - name: config
          configMap:
            name: alertview-config
