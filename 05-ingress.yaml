apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alertview
  namespace: alertview
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    # Adapt or remove middlewares to match your setup
    # traefik.ingress.kubernetes.io/router.middlewares: traefik-crowdsec-bouncer@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - alerts.example.com   # Replace with your domain
      secretName: alertview-tls-cert
  rules:
    - host: alerts.example.com   # Replace with your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: alertview
                port:
                  number: 8080
